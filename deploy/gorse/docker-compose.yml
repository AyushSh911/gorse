# Gorse stack for GCP VM — MySQL lives in ~/DurlabhDarshan/MySQL (hostname gorse-mysql).
# Shared network: docker network create durlabh-net
#
# Secrets: copy .env.example → .env and set MYSQL_PASSWORD (same as MySQL/.env).

services:
  worker:
    # nightly built from 2145bd0 (v0.6.0-alpha.1-2). Rollback: gorse-rollback/worker:v0.5.11 on the VM.
    image: zhenghaoz/gorse-worker@sha256:d0369c617d73553b3802d855eed75901b63b6ecfbf4fe319ad2977cc802fbf8d
    restart: unless-stopped
    # Cap training spikes so OOM stays inside this cgroup (VM stays up).
    # 4g on 8GB host — full quality MF+FM; worker may restart, SSH/MySQL stay up.
    mem_limit: 4096m
    ports:
      - "127.0.0.1:8089:8089"
    command: >
      --master-host master --master-port 8086
      --http-host 0.0.0.0 --http-port 8089
      --log-path /var/log/gorse/worker.log
      --log-max-size 100
      --log-max-backups 2
      --log-max-age 1
      --cache-path /var/lib/gorse/worker_cache.data
    volumes:
      - gorse_log:/var/log/gorse
      - worker_data:/var/lib/gorse
    depends_on:
      - master
    networks:
      - durlabh-net

  server:
    image: zhenghaoz/gorse-server@sha256:2cc55efc86f59b33ef322db7fec5b8b72e0a0da9c00e3a34a3fb152bd256488d
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - "127.0.0.1:8087:8087"
    command: >
      --master-host master --master-port 8086
      --http-host 0.0.0.0 --http-port 8087
      --log-path /var/log/gorse/server.log
      --log-max-size 100
      --log-max-backups 2
      --log-max-age 1
      --cache-path /var/lib/gorse/server_cache.data
    volumes:
      - gorse_log:/var/log/gorse
      - server_data:/var/lib/gorse
    depends_on:
      - master
    networks:
      - durlabh-net

  master:
    image: zhenghaoz/gorse-master@sha256:4e18537398d428e087b2f559307ff5b51fca67eca3577c77331475bdbeb389b8
    restart: unless-stopped
    mem_limit: 768m
    ports:
      - "127.0.0.1:8086:8086"
      - "127.0.0.1:8088:8088"
    environment:
      GORSE_CACHE_STORE: mysql://gorse:${MYSQL_PASSWORD}@tcp(gorse-mysql:3306)/gorse
      GORSE_DATA_STORE: mysql://gorse:${MYSQL_PASSWORD}@tcp(gorse-mysql:3306)/gorse
      GORSE_BLOB_URI: /var/lib/gorse/blob
      # xvec is opened only by master (worker/server proxy over gRPC); keep it on a volume.
      GORSE_VECTOR_STORE: xvec:///var/lib/gorse/master/vectors
    command: >
      -c /etc/gorse/config.toml
      --log-path /var/log/gorse/master.log
      --log-max-size 100
      --log-max-backups 2
      --log-max-age 1
      --cache-path /var/lib/gorse/master
    volumes:
      - ./config/config.toml:/etc/gorse/config.toml
      - gorse_log:/var/log/gorse
      - master_data:/var/lib/gorse/master
      - blob_data:/var/lib/gorse/blob
    networks:
      - durlabh-net

volumes:
  worker_data:
  server_data:
  master_data:
  gorse_log:
  blob_data:

networks:
  durlabh-net:
    external: true
