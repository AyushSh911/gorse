# Standalone MySQL for Gorse on the GCP VM.
# Lives at ~/DurlabhDarshan/MySQL — not inside the Gorge compose stack.
services:
  gorse-mysql:
    image: mysql:8.0
    container_name: gorse-mysql
    restart: unless-stopped
    mem_limit: 1024m
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: gorse
      MYSQL_USER: gorse
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ./data:/var/lib/mysql
    command:
      - --bind-address=0.0.0.0
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=512M
      # Single-node, no replica — binlogs only fill the disk.
      - --skip-log-bin
    healthcheck:
      # Use gorse user — root password interpolation often leaves healthcheck unhealthy.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ugorse", "-p${MYSQL_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - durlabh-net

networks:
  durlabh-net:
    external: true
