# Gorse reverse-proxy split for HinduSanatan
#
# Dashboard (own host — required so /js and /css resolve under Gorse):
#   https://gorse.hindusanatanapp.com/  →  http://127.0.0.1:8088/
#
# API BFF (prefer this host while apis Cloudflare origin is stale):
#   https://gorse.hindusanatanapp.com/gorse/...  →  http://127.0.0.1:8090/
#
# API BFF (apis host — keep for when Cloudflare DNS is fixed):
#   https://apis.hindusanatanapp.com/gorse/...  →  http://127.0.0.1:8090/
#
# Do NOT proxy /login, /js, /css, /api/dashboard, or /gorse-dashboard/
# on apis.hindusanatanapp.com — those collide with the :3000 gateway
# and leave the dashboard as a black page.

# --- apis.hindusanatanapp.com SSL vhost (before catch-all / → :3000) ---

ProxyPreserveHost On

ProxyPass        /gorse/  http://127.0.0.1:8090/
ProxyPassReverse /gorse/  http://127.0.0.1:8090/

<Location /gorse/v1/sync>
  Require local
</Location>

# Catch-all stays: ProxyPass / http://127.0.0.1:3000/

# --- gorse.hindusanatanapp.com SSL vhost (dedicated) ---
#
# ServerName gorse.hindusanatanapp.com
# ProxyPreserveHost On
#
# BFF first (must precede dashboard catch-all):
# ProxyPass        /gorse/  http://127.0.0.1:8090/
# ProxyPassReverse /gorse/  http://127.0.0.1:8090/
# <Location /gorse/v1/sync>
#   Require local
# </Location>
#
# Dashboard:
# ProxyPass        /  http://127.0.0.1:8088/
# ProxyPassReverse /  http://127.0.0.1:8088/
#
# DNS: A/AAAA or Cloudflare for gorse.hindusanatanapp.com → VM origin IP.
#   sudo certbot --apache -d gorse.hindusanatanapp.com
